<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0075de"/>

  <!-- Chart bars (project monitoring) -->
  <rect x="7" y="18" width="4" height="7" rx="1" fill="white" opacity="0.9"/>
  <rect x="13" y="13" width="4" height="12" rx="1" fill="white"/>
  <rect x="19" y="9" width="4" height="16" rx="1" fill="white" opacity="0.7"/>

  <!-- Trend line -->
  <polyline points="9,17 15,12 21,8" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- Dot on top of trend -->
